			<button id="undoBtn">undo</button>

	<div style="display: flex; flex-direction: column; gap: 5px">

		</div>

<!--im lazy-->
<script type="module">
//ready thing
const obbyDel = JSON.parse(localStorage.getItem("obby")) || {}
const detailTxt = document.getElementById("detailTxt");

import * as THREE from "three";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import { TransformControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/TransformControls.js";

function updateDetail() {
	if (obbyDel.name || obbyDel.creator || obbyDel.diff) {
		detailTxt.textContent = `${obbyDel.name} by ${obbyDel.creator} (Diff: ${obbyDel.diff})`
	} else {
		detailTxt.textContent = "insert something here (plz use the edit obby details button to fix this)"
	}
}
updateDetail()

//important var-------------------
let obbyName = obbyDel.name;
let obbyCreator = obbyDel.creator;
let obbyDiff = obbyDel.diff
let partTran = 1 //stud
let partScale = 0.5 //stud
let partRotate = 15 //degree
//Button n stuff--------------------------
const detailBtn = document.getElementById("detailBtn");
const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");
const exportBtn = document.getElementById("exportBtn");
const addPart = document.getElementById("addPart");
const deletePart = document.getElementById("deletePart");
const modeBtn = document.getElementById("modeBtn");
const partdetailexe = document.getElementById("partdetailexe");
const colorPicker = document.getElementById("colorPicker");
const copyCheckbox = document.getElementById("copyCheckbox")
const backgroundColor = document.getElementById("backgroundColor");
const typeInput = document.getElementById("typeInput");
const transparencyPicker = document.getElementById("transparencyPicker");
const neonPicker = document.getElementById("neonPicker");
const disabledCheckbox = document.getElementById("disableCheckbox"); //what
const jsonCheckbox = document.getElementById("showjsonCheckbox");
//three js------------------------

const parts = []
const undo = []
const redo = []

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(45,window.innerWidth / window.innerHeight,0.1,1000);
//fov -> aspect -> near -> far
scene.add(camera)
scene.background = new THREE.Color(0xffffff)
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 5);
scene.add(light)
const ambient = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambient)
camera.position.set(10,10,10)
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

const geometry = new THREE.BoxGeometry(1,1,1)
const material = new THREE.MeshStandardMaterial({color: 0x00ff00})
const spawn = new THREE.Mesh(geometry, material) //u cannot delete this
scene.add(spawn)

const modes = [
		"translate", //move
		"rotate",
		"scale"
	]

let thingery = 0

let gizmo
gizmo = new TransformControls(camera, renderer.domElement)
const orbit = new OrbitControls(camera, renderer.domElement) //gd orbit??!?!?!

gizmo.addEventListener("mouseDown", () => {
	orbit.enabled = false;
	save()
});
gizmo.addEventListener("mouseUp", () => {
	orbit.enabled = true;
});	
scene.add(gizmo.getHelper())	
gizmo.setMode(modes[thingery])

addPart.addEventListener("click", () => {
	save()
	const geometry = new THREE.BoxGeometry(2,1,4) //x,y,z
	
	const material = new THREE.MeshStandardMaterial({color: "white"})

	const part = new THREE.Mesh(geometry, material) 

	part.material.transparent = true
	part.material.opacity = 1
	part.userData.neon = 1
	part.userData.disabled = false

	scene.add(part)
	parts.push(part)	
})
//delete
deletePart.addEventListener("click", () => {
	const part = gizmo.object
	if (!part) return
	save()
	gizmo.detach()
	scene.remove(part)
	if (parts.indexOf(part) !== -1) {
		parts.splice(parts.indexOf(part), 1)
	}
	partdetailexe.textContent = "No part selected :/"
})
//keybinds
document.addEventListener("keydown", (e) => {
	if (e.key === "Delete") {
		const part = gizmo.object
		if (!part) return
		save()
		gizmo.detach()
		scene.remove(part)
		if (parts.indexOf(part) !== -1) {
			parts.splice(parts.indexOf(part), 1)
		}
		partdetailexe.textContent = "No part selected :/"
	}
	if (e.key.toLowerCase() === "e") { //haha lower case wow very cool wow ow wowowo
		thingery++;
		if (thingery === modes.length) {thingery = 0}
		gizmo?.setMode(modes[thingery]);
		if (modes[thingery] === "translate") {gizmo.setTranslationSnap(partTran)}
		else if (modes[thingery] === "rotate") {gizmo.setRotationSnap(THREE.MathUtils.degToRad(partRotate))}
		else {gizmo.setScaleSnap(partScale)}
	}
	if (e.key.toLowerCase() === "w") {
		const direction = new THREE.Vector3()
		camera.getWorldDirection(direction)
		camera.position.addScaledVector(direction, 1)
	}
	if (e.key.toLowerCase() === "s") {
		const direction = new THREE.Vector3()
		camera.getWorldDirection(direction)
		camera.position.addScaledVector(direction, -1)
	}
})

gizmo.setTranslationSnap(partTran)
gizmo.setRotationSnap(THREE.MathUtils.degToRad(partRotate))
gizmo.setScaleSnap(partScale)

modeBtn.addEventListener("click", () => {
	thingery++;
	if (thingery === modes.length) {thingery = 0}
	gizmo?.setMode(modes[thingery]);
	if (modes[thingery] === "translate") {gizmo.setTranslationSnap(partTran)}
	else if (modes[thingery] === "rotate") {gizmo.setRotationSnap(THREE.MathUtils.degToRad(partRotate))}
	else {gizmo.setScaleSnap(partScale)}
});

//color n stuff

colorPicker.addEventListener("input", () => {
	const part = gizmo.object
	if (!part) return
	part.material.color.set(colorPicker.value)
})
colorPicker.addEventListener("pointerdown", () => { //save yay
	if (gizmo.object) save()
})
backgroundColor.addEventListener("input", () => {
	scene.background = new THREE.Color(backgroundColor.value)
})
transparencyPicker.addEventListener("input", () => {
	const part = gizmo.object
	if (!part) return
	part.material.opacity = 1 - Number(transparencyPicker.value)
})
transparencyPicker.addEventListener("pointerdown", () => {
    if (gizmo.object) save()
})
disabledCheckbox.addEventListener("change", () => {
	const part = gizmo.object
	if (!part) return
	part.userData.disabled = disabledCheckbox.checked
})
disabledCheckbox.addEventListener("pointerdown", () => {
    if (gizmo.object) save()
})
neonPicker.addEventListener("input", () => {
	const part = gizmo.object
	if (!part) return
	part.userData.neon = Number(neonPicker.value)
})
neonPicker.addEventListener("pointerdown", () => {
    if (gizmo.object) save()
})

//select thingery
const raycaster = new THREE.Raycaster()
const mouse = new THREE.Vector2() //3d mouse when 😱

renderer.domElement.addEventListener("click", (e) => {
	const rect = renderer.domElement.getBoundingClientRect() //canva size
	mouse.x = ((e.clientX - rect.left) / renderer.domElement.clientWidth) * 2 - 1
	mouse.y = ((e.clientY - rect.top) / renderer.domElement.clientHeight) * -2 + 1
	//bro this coord thing is weird asf why between -1 and 1
	raycaster.setFromCamera(mouse, camera)
	const inte = raycaster.intersectObjects(parts) //check parts
	if (inte.length !== 0) {
		gizmo.attach(inte[0].object)
		const part = inte[0].object
		colorPicker.value = "#" + part.material.color.getHexString() //colr
		transparencyPicker.value = 1 - part.material.opacity
		disabledCheckbox.checked = part.userData.disabled || false
		neonPicker.value = part.userData.neon
		const size = new THREE.Vector3()
		part.geometry.computeBoundingBox()
		part.geometry.boundingBox.getSize(size)
		const size2 = size.clone().multiply(part.scale)
		partdetailexe.textContent = 
					`Position: ${part.position.x}, ${part.position.y}, ${part.position.z}\n` +
					`Size: ${size2.x}, ${size2.y}, ${size2.z}\n` +
					`Neon: ${part.userData.neon}`
	} else {
		gizmo.detach();
		partdetailexe.textContent = "No part selected :/"
		colorPicker.value = "#ffffff"
		neonPicker.value = 1
		transparencyPicker.value = 0
		disabledCheckbox.checked = false
	}
})

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate()

//undo redo----------------
function get() {
	return parts.map(part => ({part: part, position: part.position.clone(), rotation: part.rotation.clone(), scale: part.scale.clone(),
					color: part.material.color.clone(), opacity: part.material.opacity, disabled: part.userData.disabled || false,
					neon: part.userData.neon || 1}))
}
function save() {
	undo.push(get())
	redo.length = 0 //yeah
}
function restore(state) {
	for (let i = parts.length - 1; i > -1; i--) {
		if (!state.some(data => data.part === parts[i])) { //if the part is in the saved thingery
			scene.remove(parts[i])
			parts.splice(i, 1) // slash kill
		}
	}
	for (const data of state) { //loop thru all data
		if (!parts.includes(data.part)) {parts.push(data.part); scene.add(data.part)} //if deleted revive it
		data.part.position.copy(data.position)
		data.part.rotation.copy(data.rotation) //and restore its beauty
		data.part.scale.copy(data.scale)
		data.part.material.color.copy(data.color)
		data.part.material.opacity = data.opacity
		data.part.userData.disabled = data.disabled
		data.part.userData.neon = data.neon
	}
}

undoBtn.addEventListener("click", () => {
	if (undo.length === 0) return
	redo.push(get())
	const prev = undo.pop()
	restore(prev)
})
redoBtn.addEventListener("click", () => {
	if (redo.length === 0) return
	undo.push(get())
	const next = redo.pop()
	restore(next)
})
//export-----------------------

let output
exportBtn.addEventListener("click", () => {
	output = {
		"Difficulty": obbyDiff,
		"ObbyName": obbyName,
		"Creator": obbyCreator,
		"Data": {
			"Children": [
				{
					"Name": "SpawnLocation",
					"ClassName": "Spawn",
					"Shape": "Part",
					"Properties": {
						"Position": {"X": 0, "Y": 0, "Z": 0},
						"Rotation": {"X": 0, "Y": 0, "Z": 0},
						"Size": {"X": 1, "Y": 1, "Z": 1},
						"Color": {"R": 0, "G": 1, "B": 0}
					},
					"Transparency": "0",
					"disabled": true
				}
			]
		}
	}
	for (let part of parts) {
		const size = new THREE.Vector3()
		part.geometry.computeBoundingBox()
		part.geometry.boundingBox.getSize(size)
		const size2 = size.clone().multiply(part.scale)
		const color = part.material.color
		const transparency = part.material.opacity
		const neon = part.userData.neon || 1
		output.Data.Children.push({
			"Name": "Part",
			"ClassName": "Part",
			"Properties": {
				"Position": {"X": part.position.x, "Y": part.position.y, "Z": part.position.z},
				"Rotation": {"X": THREE.MathUtils.radToDeg(part.rotation.x), 
					     "Y": THREE.MathUtils.radToDeg(part.rotation.y), 
				             "Z": THREE.MathUtils.radToDeg(part.rotation.z)},
				"Size": {"X": size2.x, "Y": size2.y, "Z": size2.z},
				"Color": {"R": color.r * neon, "G": color.g * neon, "B": color.b * neon},
			},
			"Transparency": 1 - transparency,
			"disabled": part.userData.disabled || false
		})
	}
	const json = JSON.stringify(output)
	const popup = document.createElement("dialog");
	popup.innerHTML = `<h3>JSON</h3>
			<button id="die">hide</button>
			<button id="copy">copy all</button>
			<pre>${json}</pre>`
	document.body.appendChild(popup)
	popup.querySelector('#die').addEventListener("click", () => {
		popup.remove()
	})
	popup.querySelector('#copy').addEventListener("click", async () => {
		await navigator.clipboard.writeText(json)
	})
	popup.showModal();
	if (!jsonCheckbox.checked) {
		const blob = new Blob([json], {type: "application/json"})
		const url = URL.createObjectURL(blob)
		const link = document.createElement("a")
		link.href = url
		link.download = `${obbyName}.json`
  		document.body.appendChild(link)
  		link.click()
  		document.body.removeChild(link)
  		URL.revokeObjectURL(url)
	}
})

//copy paste

let copied = null
document.addEventListener("keydown", (e) => {
	if (e.ctrlKey && e.key.toLowerCase() === "c") {
		if (!gizmo.object) return
		copied = gizmo.object
	}
	if (e.ctrlKey && e.key.toLowerCase() === "v") {
		if (!copied) return
		save()
		const copy = copied.clone()
		copy.material = copied.material.clone()
		copy.userData = {...copied.userData}
		copy.position.copy(copied.position)
		if (copyCheckbox.checked) {
			copy.position.x += 3
			copy.position.y += 3
		}
		scene.add(copy)
		parts.push(copy)
		gizmo.attach(copy)
	}
})

//detail---------------------
detailBtn.addEventListener("click", () => {
	const popup = document.createElement("dialog");
	popup.innerHTML = `
		<h3>change what (type all box or else)</h3>
		<input placeholder="obby name" id="oN">
		<input placeholder="ur name (wat)" id="oC">
		<input placeholder="tier or jtoh" id="oD">
		<input placeholder="move snap (stud)" id="mS" type="number">
		<input placeholder="scale snap (stud)" id="sS" type="number">
		<input placeholder="rotate snap (degree)" id="rS" type="number">
		<button id="confirm">confirm change</button>
		<button id="die">die</button>
	`
	document.body.appendChild(popup);
	const oN = popup.querySelector("#oN");
	const oC = popup.querySelector("#oC");
	const oD = popup.querySelector("#oD");
	const mS = popup.querySelector("#mS");
	const sS = popup.querySelector("#sS");
	const rS = popup.querySelector("#rS");
	popup.querySelector("#confirm").addEventListener("click", () => {
		obbyName = oN.value || "";
		obbyCreator = oC.value || ""; //ik there is a smart way to do this
		obbyDiff = oD.value || ""; //but im not smart
		obbyDel.name = oN.value;
		obbyDel.creator = oC.value;
		obbyDel.diff = oD.value;
		partTran = Number(mS.value) || 1;
		partScale = Number(sS.value) || 0.5;
		partRotate = Number(rS.value) || 15;

		if (modes[thingery] === "translate") {gizmo.setTranslationSnap(partTran)}
		else if (modes[thingery] === "rotate") {gizmo.setRotationSnap(THREE.MathUtils.degToRad(partRotate))}
		else {gizmo.setScaleSnap(partScale)}

		updateDetail()
		popup.remove()
	});
	popup.querySelector("#die").addEventListener("click", () => {
		popup.remove()
	});
	//built in respect!
	popup.showModal();
})

window.addEventListener("beforeunload", function (event) {
	event.preventDefault()
	event.returnValue = ''
})
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight
    camera.updateProjectionMatrix()
    renderer.setSize(window.innerWidth, window.innerHeight)
})
</script>
